name: Tests

# Standard library only. Linux's sandbox tests need a wisp-agent checkout and skip here;
# wisp-agent's CI runs them against the commit it embeds.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - run: python3 -m unittest discover -s tests
